  <rect x="2" y="8" width="8" height="4" rx="1" fill="#F2C46B"/>
  <rect x="3" y="4" width="7" height="2" fill="#1C1917"/>
  <rect x="3" y="9" width="5" height="2" fill="#1C1917"/>
  <rect x="11" y="8" width="2" height="4" fill="#C8442A"/>
</svg>
